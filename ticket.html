<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>MÆDNESS® — TICKET</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!-- QR GENERATOR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>

    :root {
      --red: #ff0000;
      --black: #050505;
      --white: #ffffff;
      --green: #20d878;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: var(--black);
    }

    body {
      color: var(--white);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    /* DESKTOP */

    .desktop-warning {
      display: none;
    }

    @media (min-width: 700px) {

      .ticket-page {
        display: none !important;
      }

      .desktop-warning {
        position: fixed;
        inset: 0;
        background: var(--black);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        font-family: "Anton", sans-serif;
        font-size: 34px;
        letter-spacing: .04em;
      }

    }

    /* PAGE */

    .ticket-page {
      min-height: 100svh;
      background: var(--black);
      padding: 18px 16px 30px;
      position: relative;
      overflow: hidden;
    }

    /* TOP */

    .ticket-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,.22);
    }

    .ticket-logo {
      font-family: "Anton", sans-serif;
      font-size: 22px;
      letter-spacing: .04em;
      line-height: 1;
    }

    .ticket-logo span {
      position: relative;
      top: -2px;
      font-size: 12px;
    }

    .ticket-code {
      color: var(--red);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .18em;
      text-align: right;
      line-height: 1.5;
    }

    /* HEADER */

    .ticket-header {
      padding: 28px 0 22px;
    }

    .ticket-kicker {
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .25em;
      color: var(--red);
      margin-bottom: 7px;
    }

    .ticket-event {
      font-family: "Anton", sans-serif;
      font-size: clamp(54px, 18vw, 78px);
      line-height: .8;
      letter-spacing: -.025em;
      white-space: nowrap;
    }

    .ticket-meta {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .ticket-date {
      font-family: "Anton", sans-serif;
      font-size: 24px;
      line-height: .9;
      letter-spacing: .02em;
    }

    .ticket-location {
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .18em;
      text-align: right;
      line-height: 1.5;
    }

    /* TICKET CARD */

    .ticket-card {
      background: var(--white);
      color: var(--black);
      padding: 14px;
      position: relative;
      margin-top: 5px;
    }

    .ticket-card::before,
    .ticket-card::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--red);
      pointer-events: none;
    }

    .ticket-card::before {
      top: -5px;
      left: -5px;
      border-top: 1px solid var(--red);
      border-left: 1px solid var(--red);
    }

    .ticket-card::after {
      right: -5px;
      bottom: -5px;
      border-right: 1px solid var(--red);
      border-bottom: 1px solid var(--red);
    }

    .participant-label {
      font-size: 6px;
      font-weight: 900;
      letter-spacing: .22em;
      color: rgba(0,0,0,.55);
      margin-bottom: 4px;
    }

    .participant-name {
      font-family: "Anton", sans-serif;
      font-size: clamp(29px, 9vw, 42px);
      line-height: .9;
      letter-spacing: -.01em;
      text-transform: uppercase;
      word-break: break-word;
    }

    /* QR */

    .qr-section {
      margin-top: 18px;
      border-top: 1px solid rgba(0,0,0,.15);
      padding-top: 18px;
    }

    .qr-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .qr-label {
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .2em;
    }

    .qr-state {
      color: var(--green);
      font-size: 6px;
      font-weight: 900;
      letter-spacing: .15em;
    }

    .qr-frame {
      width: min(100%, 310px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 14px;
      border: 1px solid #000;
    }

    #qrcode {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
    }

    .qr-note {
      margin-top: 10px;
      text-align: center;
      font-size: 6px;
      font-weight: 800;
      letter-spacing: .15em;
      color: rgba(0,0,0,.55);
    }

    /* ACTIONS */

    .actions {
      margin-top: 16px;
      display: grid;
      gap: 9px;
    }

    .action-button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 0;
      cursor: pointer;
      font-family: "Anton", sans-serif;
      font-size: 18px;
      letter-spacing: .035em;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        transform .12s ease,
        background .2s ease;
    }

    .action-button:active {
      transform: scale(.97);
    }

    .wallet-button {
      background: var(--black);
      color: var(--white);
    }

    .wallet-button:hover {
      background: var(--red);
    }

    .pdf-button {
      background: var(--red);
      color: var(--white);
    }

    .pdf-button:hover {
      background: var(--black);
    }

    .wallet-button.hidden {
      display: none;
    }

    /* FOOTER */

    .ticket-footer {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      font-size: 6px;
      font-weight: 900;
      letter-spacing: .16em;
      line-height: 1.5;
      opacity: .6;
    }

    .ticket-footer-right {
      text-align: right;
    }

    /* MESSAGE */

    .action-message {
      min-height: 14px;
      margin-top: 8px;
      text-align: center;
      font-size: 6px;
      font-weight: 900;
      letter-spacing: .15em;
      color: var(--red);
    }

    /* PRINT */

    @media print {

      @page {
        size: A4;
        margin: 12mm;
      }

      html,
      body {
        background: #fff !important;
        color: #000 !important;
      }

      .desktop-warning {
        display: none !important;
      }

      .ticket-page {
        min-height: auto;
        padding: 0;
        background: #fff;
        color: #000;
      }

      .ticket-top {
        border-bottom: 1px solid #000;
      }

      .ticket-logo {
        color: #000;
      }

      .ticket-code {
        color: #000;
      }

      .ticket-kicker {
        color: #000;
      }

      .ticket-card {
        border: 1px solid #000;
        margin-top: 10px;
      }

      .actions,
      .action-message,
      .ticket-footer {
        display: none !important;
      }

      .qr-frame {
        max-width: 260px;
      }

    }

  </style>
</head>

<body>

  <div class="desktop-warning">
    MÆDNESS®<br>
    MOBILE EXPERIENCE ONLY
  </div>

  <main class="ticket-page">

    <!-- TOP -->

    <header class="ticket-top">

      <div class="ticket-logo">
        MÆDNESS<span>®</span>
      </div>

      <div class="ticket-code">
        DIGITAL ACCESS<br>
        ROTAROTT / 001
      </div>

    </header>


    <!-- HEADER -->

    <section class="ticket-header">

      <div class="ticket-kicker">
        ACCESS CONFIRMED
      </div>

      <h1
        class="ticket-event"
        id="ticketEvent"
      >
        ROTAROTT
      </h1>

      <div class="ticket-meta">

        <div
          class="ticket-date"
          id="ticketDate"
        >
          18.10.2026
        </div>

        <div
          class="ticket-location"
          id="ticketLocation"
        >
          FOGGIA / ITALY
        </div>

      </div>

    </section>


    <!-- TICKET -->

    <section class="ticket-card">

      <div class="participant-label">
        NOME E COGNOME PARTECIPANTE
      </div>

      <div
        class="participant-name"
        id="participantName"
      >
        —
      </div>


      <!-- QR -->

      <div class="qr-section">

        <div class="qr-label-row">

          <div class="qr-label">
            ENTRY QR
          </div>

          <div class="qr-state">
            VALID
          </div>

        </div>

        <div class="qr-frame">

          <div id="qrcode"></div>

        </div>

        <div class="qr-note">
          PRESENTA QUESTO QR ALL'INGRESSO
        </div>

      </div>

    </section>


    <!-- ACTIONS -->

    <section class="actions">

      <button
        type="button"
        class="action-button wallet-button"
        id="appleWalletButton"
      >
        ADD TO APPLE WALLET
      </button>

      <button
        type="button"
        class="action-button wallet-button"
        id="googleWalletButton"
      >
        ADD TO GOOGLE WALLET
      </button>

      <button
        type="button"
        class="action-button pdf-button"
        id="pdfButton"
      >
        DOWNLOAD TICKET / PDF
      </button>

    </section>

    <div
      class="action-message"
      id="actionMessage"
    ></div>


    <!-- FOOTER -->

    <footer class="ticket-footer">

      <div>
        MÆDNESS®<br>
        DIGITAL TICKET
      </div>

      <div class="ticket-footer-right">
        18.10.2026<br>
        FOGGIA / ITALY
      </div>

    </footer>

  </main>


  <script>

    /* =========================================
       RECUPERO TICKET
       ========================================= */

    const ticketStorage =
      sessionStorage.getItem(
        "maedness_ticket"
      );


    if (!ticketStorage) {

      window.location.replace(
        "./index.html"
      );

    }


    let ticketData = null;

    try {

      ticketData =
        JSON.parse(ticketStorage);

    } catch (error) {

      console.error(
        "Ticket data error:",
        error
      );

      window.location.replace(
        "./index.html"
      );

    }


    if (!ticketData) {

      window.location.replace(
        "./index.html"
      );

    }


    /* =========================================
       ELEMENTS
       ========================================= */

    const participantName =
      document.getElementById(
        "participantName"
      );

    const ticketEvent =
      document.getElementById(
        "ticketEvent"
      );

    const ticketDate =
      document.getElementById(
        "ticketDate"
      );

    const ticketLocation =
      document.getElementById(
        "ticketLocation"
      );

    const qrcode =
      document.getElementById(
        "qrcode"
      );

    const appleWalletButton =
      document.getElementById(
        "appleWalletButton"
      );

    const googleWalletButton =
      document.getElementById(
        "googleWalletButton"
      );

    const pdfButton =
      document.getElementById(
        "pdfButton"
      );

    const actionMessage =
      document.getElementById(
        "actionMessage"
      );


    /* =========================================
       DATA
       ========================================= */

    const eventData =
      ticketData.event || {};


    participantName.textContent =
      `${ticketData.firstName || ""} ${ticketData.lastName || ""}`.trim();


    ticketEvent.textContent =
      eventData.name ||
      "ROTAROTT";


    ticketDate.textContent =
      formatDate(
        eventData.date ||
        "2026-10-18"
      );


    ticketLocation.textContent =
      eventData.location ||
      "FOGGIA / ITALY";


    /* =========================================
       DATE
       ========================================= */

    function formatDate(value) {

      if (!value) {
        return "18.10.2026";
      }

      const parts =
        String(value).split("-");

      if (parts.length === 3) {

        return `${parts[2]}.${parts[1]}.${parts[0]}`;

      }

      return value;

    }


    /* =========================================
       QR
       ========================================= */

    const ticketToken =
      ticketData.token;


    if (
      ticketToken &&
      typeof QRCode !== "undefined"
    ) {

      new QRCode(
        qrcode,
        {
          text: ticketToken,
          width: 280,
          height: 280,
          colorDark: "#050505",
          colorLight: "#ffffff",
          correctLevel:
            QRCode.CorrectLevel.H
        }
      );

    } else {

      qrcode.textContent =
        "QR ERROR";

    }


    /* =========================================
       DEVICE DETECTION
       ========================================= */

    const userAgent =
      navigator.userAgent ||
      navigator.vendor ||
      window.opera ||
      "";


    const isIOS =
      /iPad|iPhone|iPod/.test(
        userAgent
      ) ||
      (
        navigator.platform ===
        "MacIntel" &&
        navigator.maxTouchPoints > 1
      );


    const isAndroid =
      /Android/i.test(
        userAgent
      );


    /*
      IOS → APPLE
      ANDROID → GOOGLE
      ALTRO → NESSUN WALLET
    */

    if (isIOS) {

      googleWalletButton.classList.add(
        "hidden"
      );

    } else if (isAndroid) {

      appleWalletButton.classList.add(
        "hidden"
      );

    } else {

      appleWalletButton.classList.add(
        "hidden"
      );

      googleWalletButton.classList.add(
        "hidden"
      );

    }


    /* =========================================
       WALLET — TEMPORANEAMENTE
       ========================================= */

    appleWalletButton.addEventListener(
      "click",
      () => {

        actionMessage.textContent =
          "APPLE WALLET / COMING NEXT";

      }
    );


    googleWalletButton.addEventListener(
      "click",
      () => {

        actionMessage.textContent =
          "GOOGLE WALLET / COMING NEXT";

      }
    );


    /* =========================================
       PDF
       ========================================= */

    pdfButton.addEventListener(
      "click",
      () => {

        actionMessage.textContent =
          "OPENING PDF EXPORT...";

        setTimeout(
          () => {

            window.print();

          },
          250
        );

      }
    );

  </script>

</body>
</html>
