<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>MÆDNESS® — TICKET</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!-- QR GENERATOR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- PDF GENERATOR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>

  <style>

    :root {
      --red: #ff0000;
      --black: #050505;
      --white: #ffffff;
      --green: #20d878;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: var(--black);
    }

    body {
      color: var(--white);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =========================================
       DESKTOP
       ========================================= */

    .desktop-warning {
      display: none;
    }

    @media (min-width: 700px) {

      .ticket-page {
        display: none !important;
      }

      .desktop-warning {
        position: fixed;
        inset: 0;
        background: var(--black);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        font-family: "Anton", sans-serif;
        font-size: 34px;
        letter-spacing: .04em;
      }

    }

    /* =========================================
       PAGE
       ========================================= */

    .ticket-page {
      min-height: 100svh;
      background: var(--black);
      padding: 18px 16px 30px;
      position: relative;
      overflow: hidden;
    }

    /* =========================================
       TOP
       ========================================= */

    .ticket-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,.22);
    }

    .ticket-logo {
      font-family: "Anton", sans-serif;
      font-size: 22px;
      letter-spacing: .04em;
      line-height: 1;
    }

    .ticket-logo span {
      position: relative;
      top: -2px;
      font-size: 12px;
    }

    .ticket-code {
      color: var(--red);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .18em;
      text-align: right;
      line-height: 1.5;
    }

    /* =========================================
       HEADER
       ========================================= */

    .ticket-header {
      padding: 28px 0 22px;
    }

    .ticket-kicker {
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .25em;
      color: var(--red);
      margin-bottom: 7px;
    }

    .ticket-event {
      font-family: "Anton", sans-serif;
      font-size: clamp(54px, 18vw, 78px);
      line-height: .8;
      letter-spacing: -.025em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .ticket-meta {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .ticket-date {
      font-family: "Anton", sans-serif;
      font-size: 24px;
      line-height: .9;
      letter-spacing: .02em;
    }

    .ticket-location {
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .18em;
      text-align: right;
      line-height: 1.5;
    }

    /* =========================================
       TICKET CARD
       ========================================= */

    .ticket-card {
      background: var(--white);
      color: var(--black);
      padding: 14px;
      position: relative;
      margin-top: 5px;
    }

    .ticket-card::before,
    .ticket-card::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--red);
      pointer-events: none;
    }

    .ticket-card::before {
      top: -5px;
      left: -5px;
      border-top: 1px solid var(--red);
      border-left: 1px solid var(--red);
    }

    .ticket-card::after {
      right: -5px;
      bottom: -5px;
      border-right: 1px solid var(--red);
      border-bottom: 1px solid var(--red);
    }

    .participant-label {
      font-size: 6px;
      font-weight: 900;
      letter-spacing: .22em;
      color: rgba(0,0,0,.55);
      margin-bottom: 4px;
    }

    .participant-name {
      font-family: "Anton", sans-serif;
      font-size: clamp(29px, 9vw, 42px);
      line-height: .9;
      letter-spacing: -.01em;
      text-transform: uppercase;
      word-break: break-word;
    }

    /* =========================================
       QR
       ========================================= */

    .qr-section {
      margin-top: 18px;
      border-top: 1px solid rgba(0,0,0,.15);
      padding-top: 18px;
    }

    .qr-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .qr-label {
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .2em;
    }

    .qr-state {
      color: var(--green);
      font-size: 6px;
      font-weight: 900;
      letter-spacing: .15em;
    }

    .qr-frame {
      width: min(100%, 310px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 14px;
      border: 1px solid #000;
    }

    #qrcode {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
    }

    .qr-note {
      margin-top: 10px;
      text-align: center;
      font-size: 6px;
      font-weight: 800;
      letter-spacing: .15em;
      color: rgba(0,0,0,.55);
    }

    /* =========================================
       ACTIONS
       ========================================= */

    .actions {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }

    .wallet-action {
      width: 100%;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1px solid rgba(255,255,255,.18);
      padding: 8px 12px;
      cursor: pointer;
      transition:
        transform .12s ease,
        opacity .2s ease;
    }

    .wallet-action:active {
      transform: scale(.97);
    }

    .wallet-action img {
      width: auto;
      height: 48px;
      max-width: 100%;
      object-fit: contain;
    }

    .wallet-action.hidden {
      display: none;
    }

    .wallet-fallback {
      display: none;
      font-family: "Anton", sans-serif;
      font-size: 18px;
      letter-spacing: .03em;
      color: #000;
    }

    .wallet-action.badge-error .wallet-fallback {
      display: block;
    }

    .wallet-action.badge-error img {
      display: none;
    }

    /* =========================================
       PDF BUTTON
       ========================================= */

    .pdf-button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 0;
      cursor: pointer;
      font-family: "Anton", sans-serif;
      font-size: 18px;
      letter-spacing: .035em;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--red);
      color: var(--white);
      transition:
        transform .12s ease,
        background .2s ease;
    }

    .pdf-button:active {
      transform: scale(.97);
    }

    .pdf-button:hover {
      background: var(--black);
    }

    .pdf-button.loading {
      opacity: .7;
      pointer-events: none;
    }

    /* =========================================
       FOOTER
       ========================================= */

    .ticket-footer {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      font-size: 6px;
      font-weight: 900;
      letter-spacing: .16em;
      line-height: 1.5;
      opacity: .6;
    }

    .ticket-footer-right {
      text-align: right;
    }

    /* =========================================
       MESSAGE
       ========================================= */

    .action-message {
      min-height: 14px;
      margin-top: 8px;
      text-align: center;
      font-size: 6px;
      font-weight: 900;
      letter-spacing: .15em;
      color: var(--red);
    }

  </style>
</head>

<body>

  <!-- DESKTOP WARNING -->

  <div class="desktop-warning">
    MÆDNESS®<br>
    MOBILE EXPERIENCE ONLY
  </div>


  <!-- TICKET PAGE -->

  <main class="ticket-page">

    <!-- TOP -->

    <header class="ticket-top">

      <div class="ticket-logo">
        MÆDNESS<span>®</span>
      </div>

      <div class="ticket-code">
        DIGITAL ACCESS<br>
        ROTAROTT / 001
      </div>

    </header>


    <!-- HEADER -->

    <section class="ticket-header">

      <div class="ticket-kicker">
        ACCESS CONFIRMED
      </div>

      <h1
        class="ticket-event"
        id="ticketEvent"
      >
        ROTAROTT
      </h1>

      <div class="ticket-meta">

        <div
          class="ticket-date"
          id="ticketDate"
        >
          18.10.2026
        </div>

        <div
          class="ticket-location"
          id="ticketLocation"
        >
          FOGGIA / ITALY
        </div>

      </div>

    </section>


    <!-- TICKET -->

    <section class="ticket-card">

      <div class="participant-label">
        NOME E COGNOME PARTECIPANTE
      </div>

      <div
        class="participant-name"
        id="participantName"
      >
        —
      </div>


      <!-- QR -->

      <div class="qr-section">

        <div class="qr-label-row">

          <div class="qr-label">
            ENTRY QR
          </div>

          <div
            class="qr-state"
            id="qrState"
          >
            VALID
          </div>

        </div>

        <div class="qr-frame">

          <div id="qrcode"></div>

        </div>

        <div class="qr-note">
          PRESENTA QUESTO QR ALL'INGRESSO
        </div>

      </div>

    </section>


    <!-- ACTIONS -->

    <section class="actions">

      <!-- APPLE WALLET -->

      <button
        type="button"
        class="wallet-action"
        id="appleWalletButton"
        aria-label="Add to Apple Wallet"
      >

        <img
          src="./apple-wallet.svg"
          alt="Add to Apple Wallet"
          id="appleWalletBadge"
        >

        <span class="wallet-fallback">
          ADD TO APPLE WALLET
        </span>

      </button>


      <!-- GOOGLE WALLET -->

      <button
        type="button"
        class="wallet-action"
        id="googleWalletButton"
        aria-label="Add to Google Wallet"
      >

        <img
          src="./google-wallet.svg"
          alt="Add to Google Wallet"
          id="googleWalletBadge"
        >

        <span class="wallet-fallback">
          ADD TO GOOGLE WALLET
        </span>

      </button>


      <!-- PDF -->

      <button
        type="button"
        class="pdf-button"
        id="pdfButton"
      >
        DOWNLOAD TICKET / PDF
      </button>

    </section>


    <div
      class="action-message"
      id="actionMessage"
    ></div>


    <!-- FOOTER -->

    <footer class="ticket-footer">

      <div>
        MÆDNESS®<br>
        DIGITAL TICKET
      </div>

      <div class="ticket-footer-right">
        <span id="footerDate">
          18.10.2026
        </span>
        <br>
        <span id="footerLocation">
          FOGGIA / ITALY
        </span>
      </div>

    </footer>

  </main>


  <script>

    /* =========================================
       RECUPERO TICKET
       ========================================= */

    const ticketStorage =
      sessionStorage.getItem(
        "maedness_ticket"
      );


    if (!ticketStorage) {

      window.location.replace(
        "./index.html"
      );

    }


    let ticketData = null;

    try {

      ticketData =
        JSON.parse(ticketStorage);

    } catch (error) {

      console.error(
        "Ticket data error:",
        error
      );

      window.location.replace(
        "./index.html"
      );

    }


    if (!ticketData) {

      window.location.replace(
        "./index.html"
      );

    }


    /* =========================================
       ELEMENTS
       ========================================= */

    const participantName =
      document.getElementById(
        "participantName"
      );

    const ticketEvent =
      document.getElementById(
        "ticketEvent"
      );

    const ticketDate =
      document.getElementById(
        "ticketDate"
      );

    const ticketLocation =
      document.getElementById(
        "ticketLocation"
      );

    const footerDate =
      document.getElementById(
        "footerDate"
      );

    const footerLocation =
      document.getElementById(
        "footerLocation"
      );

    const qrcode =
      document.getElementById(
        "qrcode"
      );

    const qrState =
      document.getElementById(
        "qrState"
      );

    const appleWalletButton =
      document.getElementById(
        "appleWalletButton"
      );

    const googleWalletButton =
      document.getElementById(
        "googleWalletButton"
      );

    const appleWalletBadge =
      document.getElementById(
        "appleWalletBadge"
      );

    const googleWalletBadge =
      document.getElementById(
        "googleWalletBadge"
      );

    const pdfButton =
      document.getElementById(
        "pdfButton"
      );

    const actionMessage =
      document.getElementById(
        "actionMessage"
      );


    /* =========================================
       DATA
       ========================================= */

    const eventData =
      ticketData.event || {};


    const participantFullName =
      `${ticketData.firstName || ""} ${ticketData.lastName || ""}`.trim();


    participantName.textContent =
      participantFullName || "—";


    ticketEvent.textContent =
      eventData.name ||
      "ROTAROTT";


    const formattedEventDate =
      formatDate(
        eventData.date ||
        "2026-10-18"
      );


    ticketDate.textContent =
      formattedEventDate;


    footerDate.textContent =
      formattedEventDate;


    ticketLocation.textContent =
      eventData.location ||
      "FOGGIA / ITALY";


    footerLocation.textContent =
      eventData.location ||
      "FOGGIA / ITALY";


    /* =========================================
       DATE
       ========================================= */

    function formatDate(value) {

      if (!value) {
        return "18.10.2026";
      }

      const parts =
        String(value).split("-");


      if (parts.length === 3) {

        return (
          `${parts[2]}.${parts[1]}.${parts[0]}`
        );

      }


      return value;

    }


    /* =========================================
       QR
       ========================================= */

    const ticketToken =
      ticketData.token;


    if (
      ticketToken &&
      typeof QRCode !== "undefined"
    ) {

      new QRCode(
        qrcode,
        {
          text: ticketToken,
          width: 280,
          height: 280,
          colorDark: "#050505",
          colorLight: "#ffffff",
          correctLevel:
            QRCode.CorrectLevel.H
        }
      );

    } else {

      qrcode.textContent =
        "QR ERROR";

      qrState.textContent =
        "ERROR";

      qrState.style.color =
        "#ff0000";

    }


    /* =========================================
       DEVICE DETECTION
       ========================================= */

    const userAgent =
      navigator.userAgent ||
      navigator.vendor ||
      window.opera ||
      "";


    const isIOS =
      /iPad|iPhone|iPod/.test(
        userAgent
      ) ||
      (
        navigator.platform ===
        "MacIntel" &&
        navigator.maxTouchPoints > 1
      );


    const isAndroid =
      /Android/i.test(
        userAgent
      );


    /*
      IOS     → APPLE WALLET
      ANDROID → GOOGLE WALLET
      ALTRO   → NESSUN WALLET
    */


    if (isIOS) {

      googleWalletButton.classList.add(
        "hidden"
      );

    } else if (isAndroid) {

      appleWalletButton.classList.add(
        "hidden"
      );

    } else {

      appleWalletButton.classList.add(
        "hidden"
      );

      googleWalletButton.classList.add(
        "hidden"
      );

    }


    /* =========================================
       BADGE FALLBACK
       ========================================= */

    appleWalletBadge.addEventListener(
      "error",
      () => {

        appleWalletButton.classList.add(
          "badge-error"
        );

      }
    );


    googleWalletBadge.addEventListener(
      "error",
      () => {

        googleWalletButton.classList.add(
          "badge-error"
        );

      }
    );


    /* =========================================
       APPLE WALLET
       ========================================= */

    appleWalletButton.addEventListener(
      "click",
      () => {

        /*
          QUI COLLEGHEREMO:
          register-ticket → Apple .pkpass

          Il badge è già quello ufficiale.
          Il pass vero verrà generato dal backend.
        */

        actionMessage.textContent =
          "APPLE WALLET / PASS IN PREPARAZIONE";

      }
    );


    /* =========================================
       GOOGLE WALLET
       ========================================= */

    googleWalletButton.addEventListener(
      "click",
      () => {

        /*
          QUI COLLEGHEREMO:
          register-ticket → Google Wallet JWT

          Il badge è già quello ufficiale.
          Il link vero verrà generato dal backend.
        */

        actionMessage.textContent =
          "GOOGLE WALLET / PASS IN PREPARAZIONE";

      }
    );


    /* =========================================
       PDF
       ========================================= */

    pdfButton.addEventListener(
      "click",
      async () => {

        if (
          typeof window.jspdf ===
          "undefined"
        ) {

          actionMessage.textContent =
            "PDF ENGINE NON DISPONIBILE";

          return;

        }


        if (!ticketToken) {

          actionMessage.textContent =
            "QR NON DISPONIBILE";

          return;

        }


        try {

          pdfButton.classList.add(
            "loading"
          );

          pdfButton.textContent =
            "CREATING PDF...";


          actionMessage.textContent =
            "GENERATING TICKET PDF";


          /*
            Aspettiamo che il QR
            sia effettivamente renderizzato.
          */

          await waitForQR();


          const {
            jsPDF
          } = window.jspdf;


          /*
            A4 verticale
            dimensioni in millimetri
          */

          const doc =
            new jsPDF({
              orientation: "portrait",
              unit: "mm",
              format: "a4"
            });


          const pageWidth =
            doc.internal.pageSize.getWidth();


          const pageHeight =
            doc.internal.pageSize.getHeight();


          const margin =
            14;


          /* =====================================
             BACKGROUND
             ===================================== */

          doc.setFillColor(
            5,
            5,
            5
          );

          doc.rect(
            0,
            0,
            pageWidth,
            pageHeight,
            "F"
          );


          /* =====================================
             TOP LOGO
             ===================================== */

          doc.setTextColor(
            255,
            255,
            255
          );

          doc.setFont(
            "helvetica",
            "bold"
          );

          doc.setFontSize(
            20
          );

          doc.text(
            "MÆDNESS®",
            margin,
            20
          );


          doc.setTextColor(
            255,
            0,
            0
          );

          doc.setFontSize(
            7
          );

          doc.text(
            "DIGITAL ACCESS",
            pageWidth - margin,
            17,
            {
              align: "right"
            }
          );


          doc.text(
            "ROTAROTT / 001",
            pageWidth - margin,
            21,
            {
              align: "right"
            }
          );


          /* =====================================
             DIVIDER
             ===================================== */

          doc.setDrawColor(
            255,
            255,
            255
          );

          doc.setLineWidth(
            .25
          );

          doc.line(
            margin,
            27,
            pageWidth - margin,
            27
          );


          /* =====================================
             EVENT
             ===================================== */

          doc.setTextColor(
            255,
            0,
            0
          );

          doc.setFontSize(
            7
          );

          doc.text(
            "ACCESS CONFIRMED",
            margin,
            38
          );


          doc.setTextColor(
            255,
            255,
            255
          );

          doc.setFont(
            "helvetica",
            "bold"
          );

          doc.setFontSize(
            30
          );


          const eventName =
            String(
              eventData.name ||
              "ROTAROTT"
            ).toUpperCase();


          doc.text(
            eventName,
            margin,
            51
          );


          /* =====================================
             DATE / LOCATION
             ===================================== */

          doc.setFontSize(
            15
          );

          doc.text(
            formattedEventDate,
            margin,
            64
          );


          doc.setFontSize(
            7
          );

          doc.text(
            String(
              eventData.location ||
              "FOGGIA / ITALY"
            ).toUpperCase(),
            pageWidth - margin,
            64,
            {
              align: "right"
            }
          );


          /* =====================================
             WHITE TICKET CARD
             ===================================== */

          const cardX =
            margin;

          const cardY =
            74;

          const cardWidth =
            pageWidth - (
              margin * 2
            );

          const cardHeight =
            165;


          doc.setFillColor(
            255,
            255,
            255
          );

          doc.rect(
            cardX,
            cardY,
            cardWidth,
            cardHeight,
            "F"
          );


          /* =====================================
             RED CORNER MARKS
             ===================================== */

          doc.setDrawColor(
            255,
            0,
            0
          );

          doc.setLineWidth(
            .4
          );


          doc.line(
            cardX - 2,
            cardY,
            cardX + 8,
            cardY
          );

          doc.line(
            cardX,
            cardY - 2,
            cardX,
            cardY + 8
          );


          doc.line(
            cardX + cardWidth - 8,
            cardY + cardHeight,
            cardX + cardWidth + 2,
            cardY + cardHeight
          );

          doc.line(
            cardX + cardWidth,
            cardY + cardHeight - 8,
            cardX + cardWidth,
            cardY + cardHeight + 2
          );


          /* =====================================
             PARTICIPANT
             ===================================== */

          doc.setTextColor(
            90,
            90,
            90
          );

          doc.setFontSize(
            6
          );

          doc.text(
            "NOME E COGNOME PARTECIPANTE",
            cardX + 7,
            cardY + 10
          );


          doc.setTextColor(
            5,
            5,
            5
          );

          doc.setFontSize(
            18
          );


          const nameForPdf =
            participantFullName
              .toUpperCase()
              .substring(0, 42);


          doc.text(
            nameForPdf || "PARTECIPANTE",
            cardX + 7,
            cardY + 21
          );


          /* =====================================
             QR SECTION DIVIDER
             ===================================== */

          doc.setDrawColor(
            190,
            190,
            190
          );

          doc.setLineWidth(
            .25
          );

          doc.line(
            cardX + 7,
            cardY + 29,
            cardX + cardWidth - 7,
            cardY + 29
          );


          /* =====================================
             QR LABEL
             ===================================== */

          doc.setTextColor(
            5,
            5,
            5
          );

          doc.setFontSize(
            6
          );

          doc.text(
            "ENTRY QR",
            cardX + 7,
            cardY + 39
          );


          doc.setTextColor(
            32,
            216,
            120
          );

          doc.text(
            "VALID",
            cardX + cardWidth - 7,
            cardY + 39,
            {
              align: "right"
            }
          );


          /* =====================================
             QR IMAGE
             ===================================== */

          const qrCanvas =
            qrcode.querySelector(
              "canvas"
            );


          let qrDataUrl = null;


          if (qrCanvas) {

            qrDataUrl =
              qrCanvas.toDataURL(
                "image/png"
              );

          } else {

            const qrImage =
              qrcode.querySelector(
                "img"
              );


            if (qrImage) {

              qrDataUrl =
                await imageToDataURL(
                  qrImage.src
                );

            }

          }


          if (!qrDataUrl) {

            throw new Error(
              "QR image unavailable"
            );

          }


          const qrSize =
            82;


          const qrX =
            cardX +
            (
              cardWidth -
              qrSize
            ) / 2;


          const qrY =
            cardY + 47;


          doc.addImage(
            qrDataUrl,
            "PNG",
            qrX,
            qrY,
            qrSize,
            qrSize,
            undefined,
            "FAST"
          );


          /* =====================================
             QR NOTE
             ===================================== */

          doc.setTextColor(
            90,
            90,
            90
          );

          doc.setFontSize(
            5.5
          );

          doc.text(
            "PRESENTA QUESTO QR ALL'INGRESSO",
            pageWidth / 2,
            cardY + 137,
            {
              align: "center"
            }
          );


          /* =====================================
             INTERNAL TOKEN
             ===================================== */

          doc.setTextColor(
            150,
            150,
            150
          );

          doc.setFontSize(
            4
          );

          doc.text(
            "DIGITAL TICKET / MÆDNESS®",
            pageWidth / 2,
            cardY + 145,
            {
              align: "center"
            }
          );


          /* =====================================
             FOOTER
             ===================================== */

          doc.setTextColor(
            255,
            255,
            255
          );

          doc.setFontSize(
            6
          );

          doc.text(
            "MÆDNESS®",
            margin,
            pageHeight - 14
          );

          doc.text(
            `${formattedEventDate} / ${String(
              eventData.location ||
              "FOGGIA / ITALY"
            ).toUpperCase()}`,
            pageWidth - margin,
            pageHeight - 14,
            {
              align: "right"
            }
          );


          /* =====================================
             SAVE
             ===================================== */

          const safeName =
            participantFullName
              .replace(
                /[^a-z0-9]+/gi,
                "-"
              )
              .replace(
                /^-+|-+$/g,
                ""
              )
              .toUpperCase();


          const fileName =
            `MAEDNESS-${eventName.replace(
              /[^a-z0-9]+/gi,
              "-"
            )}-${safeName || "TICKET"}.pdf`;


          /*
            Blob + anchor:
            niente print UI.
          */

          const pdfBlob =
            doc.output(
              "blob"
            );


          const pdfUrl =
            URL.createObjectURL(
              pdfBlob
            );


          const downloadLink =
            document.createElement(
              "a"
            );


          downloadLink.href =
            pdfUrl;


          downloadLink.download =
            fileName;


          downloadLink.style.display =
            "none";


          document.body.appendChild(
            downloadLink
          );


          downloadLink.click();


          setTimeout(
            () => {

              downloadLink.remove();

              URL.revokeObjectURL(
                pdfUrl
              );

            },
            1500
          );


          actionMessage.textContent =
            "PDF READY";


        } catch (error) {

          console.error(
            "PDF generation error:",
            error
          );

          actionMessage.textContent =
            "PDF ERROR";

        } finally {

          pdfButton.classList.remove(
            "loading"
          );

          pdfButton.textContent =
            "DOWNLOAD TICKET / PDF";

        }

      }
    );


    /* =========================================
       WAIT FOR QR
       ========================================= */

    function waitForQR() {

      return new Promise(
        (resolve, reject) => {

          let attempts = 0;

          const maxAttempts = 40;


          const checkQR = () => {

            const canvas =
              qrcode.querySelector(
                "canvas"
              );

            const image =
              qrcode.querySelector(
                "img"
              );


            if (canvas || image) {

              resolve();

              return;

            }


            attempts++;


            if (
              attempts >=
              maxAttempts
            ) {

              reject(
                new Error(
                  "QR generation timeout"
                )
              );

              return;

            }


            setTimeout(
              checkQR,
              100
            );

          };


          checkQR();

        }
      );

    }


    /* =========================================
       IMAGE → DATA URL
       ========================================= */

    function imageToDataURL(
      src
    ) {

      return new Promise(
        (resolve, reject) => {

          const image =
            new Image();


          image.crossOrigin =
            "anonymous";


          image.onload =
            () => {

              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                image.naturalWidth;


              canvas.height =
                image.naturalHeight;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0
              );


              resolve(
                canvas.toDataURL(
                  "image/png"
                )
              );

            };


          image.onerror =
            reject;


          image.src =
            src;

        }
      );

    }

  </script>
