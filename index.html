<script>

/* =========================================================
   MÆDNESS SOUND ENGINE
   ========================================================= */

let audioContext = null;
let audioMaster = null;

let audioReady = false;
let bootPlayed = false;

let lastScrollY = 0;
let lastScrollSound = 0;

let motionSoundPlayed = false;
let registrationSoundPlayed = false;


/* ---------------------------------------------------------
   CREATE AUDIO CONTEXT
   --------------------------------------------------------- */

function initAudio() {

  if (audioContext) {
    return audioContext;
  }

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContext) {
    return null;
  }

  try {

    audioContext =
      new AudioContext();

    audioMaster =
      audioContext.createGain();

    /*
      Volume generale.
      Abbastanza presente da sentirsi,
      ma non invasivo.
    */

    audioMaster.gain.value = 0.28;

    audioMaster.connect(
      audioContext.destination
    );

  } catch (error) {

    audioContext = null;

  }

  return audioContext;

}


/* ---------------------------------------------------------
   UNLOCK AUDIO
   --------------------------------------------------------- */

async function unlockAudio() {

  const ctx =
    initAudio();

  if (!ctx) {
    return false;
  }

  try {

    if (
      ctx.state === "suspended"
    ) {

      await ctx.resume();

    }

    if (
      ctx.state === "running"
    ) {

      audioReady = true;

      if (!bootPlayed) {

        bootPlayed = true;

        /*
          Piccolo ritardo per evitare che
          il browser interpreti il suono
          come parte dell'evento di sistema.
        */

        setTimeout(
          () => {
            soundBoot();
          },
          30
        );

      }

      return true;

    }

  } catch (error) {

    audioReady = false;

  }

  return false;

}


/* ---------------------------------------------------------
   BOOT
   --------------------------------------------------------- */

function soundBoot() {

  if (
    !audioReady ||
    !audioContext
  ) {
    return;
  }

  const ctx =
    audioContext;

  const now =
    ctx.currentTime;


  /* DIGITAL CLICK */

  const click =
    ctx.createOscillator();

  const clickGain =
    ctx.createGain();

  click.type =
    "square";

  click.frequency.setValueAtTime(
    1200,
    now
  );

  click.frequency.exponentialRampToValueAtTime(
    260,
    now + .07
  );

  clickGain.gain.setValueAtTime(
    0.0001,
    now
  );

  clickGain.gain.exponentialRampToValueAtTime(
    0.18,
    now + .005
  );

  clickGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + .08
  );

  click.connect(
    clickGain
  );

  clickGain.connect(
    audioMaster
  );

  click.start(now);
  click.stop(now + .09);


  /* LOW HIT */

  const bass =
    ctx.createOscillator();

  const bassGain =
    ctx.createGain();

  bass.type =
    "sine";

  bass.frequency.setValueAtTime(
    90,
    now + .08
  );

  bass.frequency.exponentialRampToValueAtTime(
    38,
    now + .38
  );

  bassGain.gain.setValueAtTime(
    0.0001,
    now + .08
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.32,
    now + .11
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + .42
  );

  bass.connect(
    bassGain
  );

  bassGain.connect(
    audioMaster
  );

  bass.start(
    now + .08
  );

  bass.stop(
    now + .44
  );

}


/* ---------------------------------------------------------
   CLICK
   --------------------------------------------------------- */

function soundClick() {

  if (
    !audioReady ||
    !audioContext
  ) {
    return;
  }

  const ctx =
    audioContext;

  const now =
    ctx.currentTime;

  const osc =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  osc.type =
    "square";

  osc.frequency.setValueAtTime(
    780,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    240,
    now + .055
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.16,
    now + .004
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + .075
  );

  osc.connect(gain);
  gain.connect(audioMaster);

  osc.start(now);
  osc.stop(now + .08);

}


/* ---------------------------------------------------------
   SCROLL SOUND
   --------------------------------------------------------- */

function soundScroll() {

  if (
    !audioReady ||
    !audioContext
  ) {
    return;
  }

  const now =
    audioContext.currentTime;

  /*
    Evita una raffica continua di suoni.
  */

  if (
    now - lastScrollSound <
    0.20
  ) {
    return;
  }

  lastScrollSound =
    now;


  const osc =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  osc.type =
    "triangle";

  /*
    Frequenza variabile:
    dà una sensazione più organica.
  */

  const frequency =
    75 +
    Math.random() * 45;

  osc.frequency.setValueAtTime(
    frequency,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    42,
    now + .10
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.055,
    now + .008
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + .12
  );

  osc.connect(gain);
  gain.connect(audioMaster);

  osc.start(now);
  osc.stop(now + .13);

}


/* ---------------------------------------------------------
   SECTION HIT
   --------------------------------------------------------- */

function soundSection() {

  if (
    !audioReady ||
    !audioContext
  ) {
    return;
  }

  const ctx =
    audioContext;

  const now =
    ctx.currentTime;


  const osc =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  osc.type =
    "sine";

  osc.frequency.setValueAtTime(
    105,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    40,
    now + .55
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.30,
    now + .025
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + .58
  );

  osc.connect(gain);
  gain.connect(audioMaster);

  osc.start(now);
  osc.stop(now + .6);


  /*
    Secondo impulso digitale.
  */

  setTimeout(
    () => {

      if (audioReady) {
        soundClick();
      }

    },
    100
  );

}


/* ---------------------------------------------------------
   SUCCESS
   --------------------------------------------------------- */

function soundSuccess() {

  if (
    !audioReady ||
    !audioContext
  ) {
    return;
  }

  const ctx =
    audioContext;

  const now =
    ctx.currentTime;


  const frequencies = [
    220,
    330,
    440
  ];


  frequencies.forEach(
    (frequency, index) => {

      const offset =
        index * .10;

      const osc =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      osc.type =
        "sine";

      osc.frequency.value =
        frequency;

      gain.gain.setValueAtTime(
        0.0001,
        now + offset
      );

      gain.gain.exponentialRampToValueAtTime(
        0.18,
        now + offset + .015
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + offset + .20
      );

      osc.connect(gain);
      gain.connect(audioMaster);

      osc.start(
        now + offset
      );

      osc.stop(
        now + offset + .22
      );

    }
  );

}


/* =========================================================
   CRITICAL PART:
   UNLOCK ON REAL USER GESTURE
   ========================================================= */

let audioGestureHandled = false;


async function handleFirstGesture() {

  if (audioGestureHandled) {
    return;
  }

  audioGestureHandled = true;

  /*
    Questo viene eseguito direttamente
    dentro il gesto dell'utente.
  */

  await unlockAudio();

}


/*
  TOUCH
*/

window.addEventListener(
  "touchstart",
  handleFirstGesture,
  {
    passive: true,
    once: true
  }
);


/*
  POINTER

  Utile per dispositivi che espongono
  pointer events.
*/

window.addEventListener(
  "pointerdown",
  handleFirstGesture,
  {
    passive: true,
    once: true
  }
);


/*
  CLICK

  Fallback.
*/

window.addEventListener(
  "click",
  handleFirstGesture,
  {
    passive: true,
    once: true
  }
);


/*
  KEYBOARD
*/

window.addEventListener(
  "keydown",
  handleFirstGesture,
  {
    passive: true,
    once: true
  }
);


/* =========================================================
   AUTOPLAY ATTEMPT
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    /*
      Proviamo comunque.
      Se il browser permette l'autoplay,
      partirà subito.
      Se lo blocca, il primo gesto lo sbloccherà.
    */

    unlockAudio();

  }
);


window.addEventListener(
  "load",
  () => {

    unlockAudio();

  }
);


/* =========================================================
   SCROLL AUDIO
   ========================================================= */

window.addEventListener(
  "scroll",
  () => {

    /*
      Se l'audio non è ancora attivo,
      non facciamo nulla.
    */

    if (!audioReady) {
      return;
    }

    const scrollY =
      window.scrollY;

    const difference =
      Math.abs(
        scrollY - lastScrollY
      );


    /*
      Ogni ~100px di movimento:
      piccolo impulso sonoro.
    */

    if (
      difference > 100
    ) {

      soundScroll();

      lastScrollY =
        scrollY;

    }


    /* -----------------------------------------------------
       HERO → MOTION
       ----------------------------------------------------- */

    const motion =
      document.querySelector(
        ".motion"
      );

    if (motion) {

      const motionRect =
        motion.getBoundingClientRect();

      if (
        motionRect.top <
        window.innerHeight * .60 &&
        !motionSoundPlayed
      ) {

        motionSoundPlayed =
          true;

        soundSection();

      }

    }


    /* -----------------------------------------------------
       MOTION → REGISTRATION
       ----------------------------------------------------- */

    const registration =
      document.querySelector(
        ".registration"
      );

    if (registration) {

      const registrationRect =
        registration.getBoundingClientRect();

      if (
        registrationRect.top <
        window.innerHeight * .65 &&
        !registrationSoundPlayed
      ) {

        registrationSoundPlayed =
          true;

        soundSection();

      }

    }

  },
  {
    passive: true
  }
);

</script>
