<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MY EVENT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: white;
    }

    body {
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #7c00ff;
      filter: blur(180px);
      opacity: 0.35;
      animation: move 8s infinite alternate ease-in-out;
    }

    @keyframes move {
      from {
        transform: translate(-150px, -100px);
      }
      to {
        transform: translate(150px, 100px);
      }
    }

    .content {
      position: relative;
      z-index: 2;
    }

    .small {
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(60px, 14vw, 180px);
      line-height: 0.8;
      letter-spacing: -7px;
      text-transform: uppercase;
      margin-bottom: 35px;
    }

    .date {
      font-size: 18px;
      letter-spacing: 4px;
      margin-bottom: 45px;
    }

    .button {
      display: inline-block;
      padding: 18px 40px;
      border: 1px solid white;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 3px;
      transition: 0.3s;
    }

    .button:hover {
      background: white;
      color: black;
      transform: scale(1.05);
    }

    .scroll {
      position: absolute;
      bottom: 30px;
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <main class="hero">

    <div class="glow"></div>

    <div class="content">

      <div class="small">
        PRESENTS
      </div>

      <h1>
        MY EVENT
      </h1>

      <div class="date">
        18.10.2026 — VENICE
      </div>

      <a href="#" class="button">
        GET YOUR TICKET
      </a>

    </div>

    <div class="scroll">
      SCROLL TO ENTER
    </div>

  </main>

</body>
</html>
