<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>MÆDNESS® — PARTECIPANTI</title>

  <style>
    :root {
      --red: #ff0000;
      --black: #050505;
      --white: #ffffff;
      --green: #20d878;
      --orange: #ff9d00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100svh;
      padding: 18px;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      min-height: calc(100svh - 36px);
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================
       TOP
       ========================================================== */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 26px;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .brand span {
      font-size: 11px;
      vertical-align: top;
      margin-left: 2px;
    }

    .top-label {
      color: var(--red);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-align: right;
      line-height: 1.4;
    }

    /* ==========================================================
       TITLE
       ========================================================== */

    .title {
      margin: 0 0 8px;
      font-size: clamp(48px, 16vw, 86px);
      line-height: 0.84;
      letter-spacing: -0.07em;
      font-weight: 900;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    /* ==========================================================
       TOTAL
       ========================================================== */

    .total-box {
      border-top: 1px solid #292929;
      border-bottom: 1px solid #292929;
      padding: 16px 0;
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .total-label {
      color: #777;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .total-number {
      color: var(--white);
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .total-caption {
      color: var(--red);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    /* ==========================================================
       SEARCH
       ========================================================== */

    .search-section {
      margin-bottom: 20px;
    }

    .search-label {
      display: block;
      margin-bottom: 9px;
      color: #777;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1px solid #292929;
      outline: none;
      background: #000;
      color: var(--white);
      padding: 0 13px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 0;
    }

    .search-input::placeholder {
      color: #555;
    }

    .search-input:focus {
      border-color: var(--red);
    }

    .search-button {
      width: 88px;
      height: 46px;
      border: 1px solid var(--red);
      background: var(--red);
      color: var(--white);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
      cursor: pointer;
    }

    .search-button:disabled {
      opacity: 0.5;
    }

    .search-status {
      min-height: 16px;
      margin-top: 8px;
      color: #666;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ==========================================================
       PDF
       ========================================================== */

    .pdf-button {
      width: 100%;
      height: 48px;
      margin-top: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--red);
      background: var(--red);
      color: var(--white);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.1em;
      cursor: pointer;
    }

    .pdf-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* ==========================================================
       LIST
       ========================================================== */

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .list-header-label {
      color: #777;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .list-header-count {
      color: var(--red);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    .participants-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .participant-item {
      border: 1px solid #292929;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .participant-number {
      width: 28px;
      flex-shrink: 0;
      color: #444;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .participant-info {
      flex: 1;
      min-width: 0;
    }

    .participant-name {
      color: var(--white);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .participant-date {
      margin-top: 5px;
      color: #555;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .participant-status {
      flex-shrink: 0;
      text-align: right;
      color: var(--green);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .participant-status.used {
      color: var(--orange);
    }

    .participant-status-time {
      margin-top: 4px;
      color: #555;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .empty {
      padding: 30px 0;
      text-align: center;
      color: #555;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    .loading {
      padding: 30px 0;
      text-align: center;
      color: var(--white);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    /* ==========================================================
       FOOTER
       ========================================================== */

    .footer {
      margin-top: auto;
      padding-top: 30px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #444;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    @media (max-width: 380px) {

      body {
        padding: 14px;
      }

      .page {
        min-height: calc(100svh - 28px);
      }

      .participant-item {
        padding: 11px;
      }

      .participant-name {
        font-size: 13px;
      }

    }
  </style>
</head>

<body>

  <main class="page">

    <!-- ========================================================

    <header class="top">

      <div class="brand">

      </div>

      <div class="top-label">
        ENTRY CONTROL<br>
        18.10.2026
      </div>

    </header>


    <!-- ========================================================

         ======================================================== -->

    <h1 class="title">

    </h1>


    <p class="subtitle">

    </p>


    <!-- ========================================================

         ======================================================== -->

    <div class="total-box">

      <span class="total-label">

      <span
        id="totalNumber"

    <!-- ========================================================
         SEARCH
         ======================================================== -->

    <section class="search-section">

      <label

      ></div>

    </section>


    <!-- ========================================================

         ======================================================== -->

    <button

    >
      SCARICA LISTA PDF
    </button>


    <!-- ========================================================
         LIST HEADER
         ======================================================== -->

    <div class="list-header">

      <span class="list-header-label">
        ISCRITTI
      </span>

      <span
        id="listHeaderCount"

      >
        0
      </span>

    </div>


    <!-- ========================================================
         LIST
         ======================================================== -->

    <section
      id="participantsList"

    >

      <div class="loading">
        CARICAMENTO LISTA...
      </div>

    </section>


    <!-- ========================================================
         FOOTER

    <footer class="footer">

      <span>
        MÆDNESS®
      </span>

      <span>
        ENTRY SYSTEM / 02
      </span>

    </footer>

  </main>


  <!-- ==========================================================
       jsPDF
       ========================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ></script>


  <script>

    /*
     * ==========================================================
     * SUPABASE
     * ==========================================================
     */

    const SUPABASE_URL =
      "https://rmniojqexlasxfxisqbm.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_SbqTxagdWxbf9QjnMzKQsg_E_aCGvm-";


    const PARTICIPANTS_RPC_URL =
      `${SUPABASE_URL}/rest/v1/rpc/get_participants_list`;


    /*
     * ==========================================================
     * ELEMENTI
     * ==========================================================
     */

    const totalNumber =
      document.getElementById(
        "totalNumber"
      );


    const listHeaderCount =
      document.getElementById(
        "listHeaderCount"
      );


    const participantsList =
      document.getElementById(
        "participantsList"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const searchButton =
      document.getElementById(
        "searchButton"
      );


    const searchStatus =
      document.getElementById(
        "searchStatus"
      );


    const pdfButton =
      document.getElementById(
        "pdfButton"
      );


    /*
     * ==========================================================
     * DATA
     * ==========================================================
     */

    let allParticipants = [];


    /*
     * ==========================================================
     * DATE
     * ==========================================================
     */

    function formatDateTime(
      value
    ) {

      if (!value) {
        return "—";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return date.toLocaleString(
        "it-IT",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /*
     * ==========================================================
     * ESCAPE
     * ==========================================================
     */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /*
     * ==========================================================
     * RENDER LIST
     * ==========================================================
     */

    function renderParticipants(
      participants
    ) {

      participantsList.innerHTML = "";


      listHeaderCount.textContent =
        participants.length;


      if (
        participants.length === 0
      ) {

        participantsList.innerHTML = `
          <div class="empty">
            NESSUN PARTECIPANTE TROVATO
          </div>
        `;

        return;

      }


      participants.forEach(
        (
          person,
          index
        ) => {

          const used =
            person.ticket_status ===
            "USED" ||
            Boolean(
              person.used_at
            );


          const item =
            document.createElement(
              "div"
            );

          item.className =
            "participant-item";


          const number =
            document.createElement(
              "div"
            );

          number.className =
            "participant-number";


          number.textContent =
            String(
              index + 1
            ).padStart(
              2,
              "0"
            );


          const info =
            document.createElement(
              "div"
            );

          info.className =
            "participant-info";


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "participant-name";


          name.textContent =
            `${person.first_name || ""} ${person.last_name || ""}`
              .trim();


          const registrationDate =
            document.createElement(
              "div"
            );

          registrationDate.className =
            "participant-date";


          registrationDate.textContent =
            person.created_at
              ? `ISCRIZIONE: ${formatDateTime(
                  person.created_at
                )}`
              : "ISCRIZIONE";


          info.appendChild(
            name
          );


          info.appendChild(
            registrationDate
          );


          const statusBox =
            document.createElement(
              "div"
            );


          const status =
            document.createElement(
              "div"
            );


          status.className =
            used
              ? "participant-status used"
              : "participant-status";


          status.textContent =
            used
              ? "ENTRATO"
              : "ISCRITTO";


          statusBox.appendChild(
            status
          );


          if (
            used &&
            person.used_at
          ) {

            const usedTime =
              document.createElement(
                "div"
              );


            usedTime.className =
              "participant-status-time";


            usedTime.textContent =
              formatDateTime(
                person.used_at
              );


            statusBox.appendChild(
              usedTime
            );

          }


          item.appendChild(
            number
          );

          item.appendChild(
            info
          );

          item.appendChild(
            statusBox
          );


          participantsList.appendChild(
            item
          );

        }
      );

    }


    /*
     * ==========================================================
     * LOAD PARTICIPANTS
     * ==========================================================
     */

    async function loadParticipants() {

      participantsList.innerHTML = `
        <div class="loading">
          CARICAMENTO LISTA...
        </div>
      `;


      try {

        const response =
          await fetch(
            PARTICIPANTS_RPC_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
              },

              body:
                JSON.stringify({}),

              cache:
                "no-store"
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          console.error(
            "Participants error:",
            data
          );


          participantsList.innerHTML = `
            <div class="empty">
              ERRORE CARICAMENTO LISTA
            </div>
          `;

          return;

        }


        allParticipants =
          Array.isArray(data)
            ? data
            : [];


        totalNumber.textContent =
          allParticipants.length;


        renderParticipants(
          allParticipants
        );

      }

      catch (error) {

        console.error(
          "Participants error:",
          error
        );


        participantsList.innerHTML = `
          <div class="empty">
            ERRORE DI CONNESSIONE
          </div>
        `;

      }

    }


    /*
     * ==========================================================
     * SEARCH
     * ==========================================================
     */

    function searchParticipants() {

      const query =
        String(
          searchInput.value || ""
        )
          .trim()
          .toLowerCase();


      if (!query) {

        searchStatus.textContent =
          "";


        renderParticipants(
          allParticipants
        );


        return;

      }


      const filtered =
        allParticipants.filter(
          person => {

            const firstName =
              String(
                person.first_name || ""
              )
                .toLowerCase();


            const lastName =
              String(
                person.last_name || ""
              )
                .toLowerCase();


            const fullName =
              `${firstName} ${lastName}`;


            return (
              firstName.includes(
                query
              ) ||
              lastName.includes(
                query
              ) ||
              fullName.includes(
                query
              )
            );

          }
        );


      searchStatus.textContent =
        `${filtered.length} RISULTAT${filtered.length === 1 ? "O" : "I"}`;


      renderParticipants(
        filtered
      );

    }


    searchButton.addEventListener(
      "click",
      searchParticipants
    );


    searchInput.addEventListener(
      "input",
      searchParticipants
    );


    searchInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          searchParticipants();

        }

      }
    );


    /*
     * ==========================================================
     * PDF
     * ==========================================================
     *
     * IMPORTANTE:
     * Il PDF usa SEMPRE allParticipants.
     *
     * Quindi:
     * - se stai cercando Mario, il PDF contiene comunque tutti
     * - l'ordine del PDF è per COGNOME
     * - a parità di cognome ordina per NOME
     *
     * ==========================================================
     */

    function downloadPdf() {

      if (
        !Array.isArray(
          allParticipants
        ) ||
        allParticipants.length === 0
      ) {

        alert(
          "Nessun partecipante da esportare."
        );

        return;

      }


      if (
        !window.jspdf ||
        !window.jspdf.jsPDF
      ) {

        alert(
          "PDF non disponibile. Ricarica la pagina."
        );

        return;

      }


      pdfButton.disabled =
        true;

      pdfButton.textContent =
        "CREAZIONE PDF...";


      try {

        const {
          jsPDF
        } = window.jspdf;


        const doc =
          new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
          });


        /*
         * ======================================================
         * PDF COLORS
         * ======================================================
         */

        const BLACK = [
          5,
          5,
          5
        ];

        const RED = [
          255,
          0,
          0
        ];

        const WHITE = [
          255,
          255,
          255
        ];

        const GREY = [
          110,
          110,
          110
        ];

        const GREEN = [
          32,
          216,
          120
        ];

        const ORANGE = [
          255,
          157,
          0
        ];


        /*
         * ======================================================
         * BACKGROUND
         * ======================================================
         */

        doc.setFillColor(
          ...BLACK
        );

        doc.rect(
          0,
          0,
          210,
          297,
          "F"
        );


        /*
         * ======================================================
         * HEADER
         * ======================================================
         */

        doc.setTextColor(
          ...WHITE
        );

        doc.setFont(
          "helvetica",
          "bold"
        );

        doc.setFontSize(
          22
        );

        doc.text(
          "MÆDNESS®",
          14,
          18
        );


        doc.setTextColor(
          ...RED
        );

        doc.setFontSize(
          7
        );

        doc.text(
          "ENTRY CONTROL",
          196,
          12,
          {
            align: "right"
          }
        );


        doc.text(
          "18.10.2026",
          196,
          17,
          {
            align: "right"
          }
        );


        /*
         * ======================================================
         * TITLE
         * ======================================================
         */

        doc.setTextColor(
          ...WHITE
        );

        doc.setFontSize(
          28
        );

        doc.text(
          "PARTECIPANTI",
          14,
          39
        );


        doc.setTextColor(
          ...RED
        );

        doc.setFontSize(
          8
        );

        doc.text(
          "ROTAROTT / FOGGIA / ITALY",
          14,
          46
        );


        /*
         * ======================================================
         * TOTAL
         * ======================================================
         */

        doc.setDrawColor(
          45,
          45,
          45
        );

        doc.line(
          14,
          53,
          196,
          53
        );


        doc.line(
          14,
          65,
          196,
          65
        );


        doc.setTextColor(
          ...GREY
        );

        doc.setFontSize(
          7
        );

        doc.text(
          "TOTALE ISCRITTI",
          14,
          61
        );


        doc.setTextColor(
          ...WHITE
        );

        doc.setFontSize(
          16
        );

        doc.text(
          String(
            allParticipants.length
          ),
          196,
          61,
          {
            align: "right"
          }
        );


        /*
         * ======================================================
         * SORT PDF
         * ======================================================
         */

        const pdfParticipants =
          [...allParticipants]
            .sort(
              (
                a,
                b
              ) => {

                const lastA =
                  String(
                    a.last_name || ""
                  )
                    .trim()
                    .toLocaleLowerCase(
                      "it"
                    );


                const lastB =
                  String(
                    b.last_name || ""
                  )
                    .trim()
                    .toLocaleLowerCase(
                      "it"
                    );


                const lastCompare =
                  lastA.localeCompare(
                    lastB,
                    "it",
                    {
                      sensitivity:
                        "base"
                    }
                  );


                if (
                  lastCompare !==
                  0
                ) {

                  return lastCompare;

                }


                const firstA =
                  String(
                    a.first_name || ""
                  )
                    .trim()
                    .toLocaleLowerCase(
                      "it"
                    );


                const firstB =
                  String(
                    b.first_name || ""
                  )
                    .trim()
                    .toLocaleLowerCase(
                      "it"
                    );


                return firstA.localeCompare(
                  firstB,
                  "it",
                  {
                    sensitivity:
                      "base"
                  }
                );

              }
            );


        /*
         * ======================================================
         * LIST
         * ======================================================
         */

        let y =
          74;

        const pageBottom =
          282;

        const rowHeight =
          9;


        pdfParticipants.forEach(
          (
            person,
            index
          ) => {

            /*
             * Nuova pagina
             */

            if (
              y >
              pageBottom
            ) {

              doc.addPage();


              doc.setFillColor(
                ...BLACK
              );

              doc.rect(
                0,
                0,
                210,
                297,
                "F"
              );


              doc.setTextColor(
                ...WHITE
              );

              doc.setFont(
                "helvetica",
                "bold"
              );

              doc.setFontSize(
                12
              );

              doc.text(
                "MÆDNESS® — ROTAROTT",
                14,
                16
              );


              doc.setTextColor(
                ...RED
              );

              doc.setFontSize(
                7
              );

              doc.text(
                "PARTECIPANTI",
                196,
                16,
                {
                  align: "right"
                }
              );


              y =
                27;

            }


            /*
             * Riga
             */

            const used =
              person.ticket_status ===
              "USED" ||
              Boolean(
                person.used_at
              );


            if (
              index % 2 ===
              0
            ) {

              doc.setFillColor(
                12,
                12,
                12
              );

              doc.rect(
                14,
                y - 5.5,
                182,
                rowHeight,
                "F"
              );

            }


            /*
             * Numero
             */

            doc.setTextColor(
              ...GREY
            );

            doc.setFont(
              "helvetica",
              "normal"
            );

            doc.setFontSize(
              7
            );

            doc.text(
              String(
                index + 1
              ).padStart(
                2,
                "0"
              ),
              17,
              y
            );


            /*
             * Nome
             */

            doc.setTextColor(
              ...WHITE
            );

            doc.setFont(
              "helvetica",
              "bold"
            );

            doc.setFontSize(
              8.5
            );


            const fullName =
              `${person.last_name || ""} ${person.first_name || ""}`
                .trim();


            doc.text(
              fullName
                .toLocaleUpperCase(
                  "it-IT"
                ),
              31,
              y
            );


            /*
             * Stato
             */

            doc.setFontSize(
              7
            );


            if (used) {

              doc.setTextColor(
                ...ORANGE
              );

              doc.text(
                "ENTRATO",
                196,
                y,
                {
                  align: "right"
                }
              );

            }

            else {

              doc.setTextColor(
                ...GREEN
              );

              doc.text(
                "ISCRITTO",
                196,
                y,
                {
                  align: "right"
                }
              );

            }


            y +=
              rowHeight;

          }
        );


        /*
         * ======================================================
         * FOOTER SU TUTTE LE PAGINE
         * ======================================================
         */

        const pageCount =
          doc.getNumberOfPages();


        for (
          let page = 1;
          page <= pageCount;
          page++
        ) {

          doc.setPage(
            page
          );


          doc.setTextColor(
            ...GREY
          );

          doc.setFont(
            "helvetica",
            "normal"
          );

          doc.setFontSize(
            6
          );


          doc.text(
            "MÆDNESS® / ROTAROTT / FOGGIA / ITALY",
            14,
            291
          );


          doc.text(
            `PAGINA ${page} / ${pageCount}`,
            196,
            291,
            {
              align: "right"
            }
          );

        }


        /*
         * ======================================================
         * DOWNLOAD
         * ======================================================
         */

        const now =
          new Date();


        const date =
          now
            .toISOString()
            .slice(
              0,
              10
            );


        doc.save(
          `MAEDNESS_ROTAROTT_PARTECIPANTI_${date}.pdf`
        );

      }

      catch (error) {

        console.error(
          "PDF error:",
          error
        );


        alert(
          "Errore nella creazione del PDF."
        );

      }

      finally {

        pdfButton.disabled =
          false;

        pdfButton.textContent =
          "SCARICA LISTA PDF";

      }

    }


    pdfButton.addEventListener(
      "click",
      downloadPdf
    );


    /*
     * ==========================================================
     * AUTO REFRESH
     * ==========================================================
     */

    loadParticipants();


    setInterval(
      loadParticipants,
      10000
    );

  </script>

</body>
</html>
